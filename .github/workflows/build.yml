# Two jobs with different economics:
#
#  - check: lint + format check + typecheck + unit tests, Linux only, on every push. Cheap
#    enough to always run, and it is what keeps the protocol layer honest.
#
#  - build: the three-platform installer matrix, by hand ONLY. macOS bills at
#    10x and Windows 2x while this repo is private, so a matrix that fires on
#    its own is a bill for a commit that edited a comment. Note the "Run
#    workflow" button only appears once this file is on the default branch.
#
# push is limited to branches so that pushing a tag does not re-run check on
# a commit it has already passed on -- tags no longer trigger anything.
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  build:
    # Installers only when explicitly asked for, never automatically.
    if: github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      # One platform failing should not hide the others.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            files: dist/*.exe
          - os: macos-latest
            artifact: macos
            files: dist/*.dmg
          # Both Linux formats. The .deb is the one that works properly on
          # current Ubuntu -- see docs/preview-testing.md for why the
          # AppImage needs two extra steps there.
          - os: ubuntu-latest
            artifact: linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ci, not install: the lockfile is the point.
      - run: npm ci
      - run: npm run dist
      # if-no-files-found: error, because a build that produces nothing while
      # reporting success is the failure mode worth catching.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
