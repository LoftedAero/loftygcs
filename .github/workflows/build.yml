# Jobs with different economics:
#
#  - check: lint + format check + typecheck + unit tests, Linux only, on every
#    push to main and every pull request. Cheap enough to always run, and it
#    is what keeps the protocol layer honest. Branch protection requires it,
#    so it must run for pull requests from forks too; those runs get no
#    secrets.
#
#  - release, build, android and web: a draft GitHub release holding the
#    three-platform installers, the signed Android APK and the web zip, and the web app's deploy to Cloudflare
#    Pages, by hand ONLY. A release is one run. macOS
#    bills at 10x and Windows 2x while this repo is private, so a matrix that
#    fires on its own is a bill for a commit that edited a comment. Note the
#    "Run workflow" button only appears once this file is on the default
#    branch.
#
# A branch is checked through its pull request rather than on every push, so
# a pull request's commits are not checked twice. Tags trigger nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      installers:
        description: Build the installers (untick to deploy only the web app)
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  release:
    # The draft release the installers and the web zip are uploaded to. Its
    # tag is created only when the draft is published. Release files do not
    # count against the Actions storage quota that artifacts share.
    if: github.event_name == 'workflow_dispatch' && inputs.installers
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release if it does not exist
        run: |
          v=$(node -p "require('./package.json').version")
          gh release view "v$v" >/dev/null 2>&1 ||
            gh release create "v$v" --draft --target "$GITHUB_SHA" \
              --title "Lofty GCS $v" --notes "Draft: release notes to follow."

  build:
    # Installers only when explicitly asked for, never automatically.
    if: github.event_name == 'workflow_dispatch' && inputs.installers
    needs: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      # One platform failing should not hide the others.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: dist/*.exe
          - os: macos-latest
            files: dist/*.dmg
          # Both Linux formats. The .deb is the one that works properly on
          # current Ubuntu; docs/preview-testing.md says why the AppImage
          # needs two extra steps there.
          - os: ubuntu-latest
            files: dist/*.AppImage dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ci, not install: the lockfile is the point.
      - run: npm ci
      - run: npm run dist
      # An unmatched glob stays literal and the upload fails, so a build that
      # produces nothing cannot report success.
      - name: Upload to the draft release
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          gh release upload "v$v" ${{ matrix.files }} --clobber

  android:
    # The Android app, signed with the release key so each build installs
    # over the last (docs/android.md, Signing). Same manual trigger as the
    # installers.
    if: github.event_name == 'workflow_dispatch' && inputs.installers
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:web
      - run: npx cap sync android
      # Refuses to build without the key: an APK signed with anything else
      # cannot update an installed one.
      - name: Write the release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
      # The runner's Android SDK is found through ANDROID_HOME; Gradle fetches
      # any platform it lacks.
      - run: ./gradlew assembleRelease
        working-directory: android
        env:
          LOFTY_KEYSTORE: ${{ runner.temp }}/release.jks
          LOFTY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LOFTY_KEY_ALIAS: lofty-gcs
          LOFTY_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Upload to the draft release
        run: |
          v=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "Lofty-GCS-$v-android.apk"
          gh release upload "v$v" "Lofty-GCS-$v-android.apk" --clobber

  web:
    # The web app ships with the installers: same manual trigger, same commit.
    # It still runs when the installers are unticked, which skips release.
    if: github.event_name == 'workflow_dispatch' && !failure() && !cancelled()
    needs: [check, release]
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in this environment, which only main may
    # deploy from, so a pushed branch with an edited workflow cannot use them.
    environment: production
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:web
      - name: Upload to the draft release
        if: inputs.installers
        run: |
          v=$(node -p "require('./package.json').version")
          gh release upload "v$v" dist/*_web.zip --clobber
      # Skipped until the Cloudflare secrets exist. Creating the project fails
      # harmlessly once it exists.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4 pages project create lofty-gcs --production-branch main || true
          npx --yes wrangler@4 pages deploy dist-web --project-name lofty-gcs --branch main
