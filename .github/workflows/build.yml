# Jobs with different economics:
#
#  - check: lint + format check + typecheck + unit tests, Linux only, on every push. Cheap
#    enough to always run, and it is what keeps the protocol layer honest.
#
#  - release, build and web: a draft GitHub release holding the three-platform
#    installers and the web zip, and the web app's deploy to Cloudflare
#    Pages, by hand ONLY. A release is one run. macOS
#    bills at 10x and Windows 2x while this repo is private, so a matrix that
#    fires on its own is a bill for a commit that edited a comment. Note the
#    "Run workflow" button only appears once this file is on the default
#    branch.
#
# push is limited to branches so that pushing a tag does not re-run check on
# a commit it has already passed on -- tags no longer trigger anything.
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      installers:
        description: Build the installers (untick to deploy only the web app)
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  release:
    # The draft release the installers and the web zip are uploaded to. Its
    # tag is created only when the draft is published. Release files do not
    # count against the Actions storage quota that artifacts share.
    if: github.event_name == 'workflow_dispatch' && inputs.installers
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release if it does not exist
        run: |
          v=$(node -p "require('./package.json').version")
          gh release view "v$v" >/dev/null 2>&1 ||
            gh release create "v$v" --draft --target "$GITHUB_SHA" \
              --title "Lofty GCS $v" --notes "Draft: release notes to follow."

  build:
    # Installers only when explicitly asked for, never automatically.
    if: github.event_name == 'workflow_dispatch' && inputs.installers
    needs: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      # One platform failing should not hide the others.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: dist/*.exe
          - os: macos-latest
            files: dist/*.dmg
          # Both Linux formats. The .deb is the one that works properly on
          # current Ubuntu; docs/preview-testing.md says why the AppImage
          # needs two extra steps there.
          - os: ubuntu-latest
            files: dist/*.AppImage dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ci, not install: the lockfile is the point.
      - run: npm ci
      - run: npm run dist
      # An unmatched glob stays literal and the upload fails, so a build that
      # produces nothing cannot report success.
      - name: Upload to the draft release
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          gh release upload "v$v" ${{ matrix.files }} --clobber

  web:
    # The web app ships with the installers: same manual trigger, same commit.
    # It still runs when the installers are unticked, which skips release.
    if: github.event_name == 'workflow_dispatch' && !failure() && !cancelled()
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:web
      - name: Upload to the draft release
        if: inputs.installers
        run: |
          v=$(node -p "require('./package.json').version")
          gh release upload "v$v" dist/*_web.zip --clobber
      # Skipped until the Cloudflare secrets exist. Creating the project fails
      # harmlessly once it exists.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4 pages project create lofty-gcs --production-branch main || true
          npx --yes wrangler@4 pages deploy dist-web --project-name lofty-gcs --branch main
