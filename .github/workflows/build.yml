# Two jobs with different economics:
#
#  - check: lint + typecheck + unit tests, Linux only, on every push. Cheap
#    enough to always run, and it is what keeps the protocol layer honest.
#
#  - build: the three-platform installer matrix, by hand or on a release
#    tag only. macOS bills at 10x and Windows 2x on private repos; a full
#    round is pure waste for a commit that edits a comment. Note the "Run
#    workflow" button only appears once this file is on the default branch.
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    # Installers only when asked for: manual dispatch or a version tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      # One platform failing should not hide the others.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            files: dist/*.exe
          - os: macos-latest
            artifact: macos
            files: dist/*.dmg
          # Both Linux formats. The .deb is the one that works properly on
          # current Ubuntu -- see docs/preview-testing.md for why the
          # AppImage needs two extra steps there.
          - os: ubuntu-latest
            artifact: linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ci, not install: the lockfile is the point.
      - run: npm ci
      - run: npm run dist
      # if-no-files-found: error, because a build that produces nothing while
      # reporting success is the failure mode worth catching.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
