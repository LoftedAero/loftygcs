<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D2D2F" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Fonts per the design system (DESIGN.md §1). The fallback stacks in
         lofted-aero.css are real: the app must work offline at the field. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&family=Roboto+Mono:wght@400&display=swap"
    />
    <title>Lofty GCS</title>
    <!-- Theme before first paint. The store applies the same attribute once
         React is up, but that is several hundred milliseconds of white
         window on a dark desktop, which looks like a bug. Deliberately
         inline and dependency-free so it runs before the bundle loads. -->
    <script>
      ;(function () {
        try {
          var c = localStorage.getItem('loftgcs.theme') || 'system'
          var dark =
            c === 'dark' ||
            (c === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* storage blocked: the stylesheet's light default stands */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
